<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found | Joinerycraft</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Josefin+Sans:wght@300;400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <style>
    .nf { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.25rem; background: var(--tint); }
    .nf-card { max-width: 560px; }
    .nf img { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1.5rem; }
    .nf h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 1rem; }
    .nf p { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main class="nf">
    <div class="nf-card">
      <img src="/images/favicon.png" alt="Joinerycraft">
      <p class="eyebrow">Page not found</p>
      <h1>This one's not in the workshop.</h1>
      <p>The page you're after has moved or doesn't exist. Try one of these instead.</p>
      <div class="btn-row btn-row-center">
        <a href="/" class="btn btn-accent">Home</a>
        <a href="/kitchens" class="btn btn-outline">Kitchens</a>
        <a href="/wardrobes" class="btn btn-outline">Wardrobes</a>

      </div>
    </div>
  </main>
