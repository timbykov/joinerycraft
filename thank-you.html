<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Thanks | Joinerycraft</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    .thanks { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 2rem 1.25rem; background: var(--tint); }
    .thanks-card { max-width: 560px; }
    .thanks img { width: 64px; height: 64px; border-radius: 50%; margin: 0 auto 1.5rem; }
    .thanks h1 { font-size: clamp(2.2rem, 5vw, 3.2rem); margin-bottom: 1rem; }
    .thanks p { color: var(--muted); font-size: 1.1rem; margin-bottom: 2rem; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-card">
      <img src="images/favicon.png" alt="Joinerycraft">
      <h1>Thanks, we've got it.</h1>
      <p>We'll be in touch within one business day to talk through your project. If it's urgent, give us a call on <a href="tel:1300205498">1300 205 498</a>.</p>
      <div class="btn-row btn-row-center">
        <a href="/" class="btn btn-accent">Back to the website</a>
        <a href="https://www.instagram.com/joinerycraft_/" class="btn btn-outline" target="_blank" rel="noopener">See more on Instagram</a>
      </div>
    </div>
  </main>
</body>
</html>
